name: Daily Torn Travel Screenshot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and download screenshot
        env:
          APIFLASH_KEY: ${{ secrets.APIFLASH_KEY }}
        run: |
          TARGET_URL="https://queerhustlers.blogspot.com/2026/11/TornCityExportIntercityArbitrage.html"
          ENCODED_URL=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TARGET_URL")

          curl --fail --show-error -sSL \
            "https://api.apiflash.com/v1/urltoimage?access_key=${APIFLASH_KEY}&url=${ENCODED_URL}&wait_until=network_idle&delay=10&width=720&full_page=true&fresh=true" \
            -o travel.png

          ls -lh travel.png

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add travel.png
          if git diff --staged --quiet; then
            echo "No changes in screenshot."
          else
            git commit -m "Auto-update travel screenshot [skip ci]"
            git push
          fi
