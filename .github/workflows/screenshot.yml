name: Daily Torn Travel Screenshot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and download screenshot
        env:
          APIFLASH_KEY: ${{ secrets.APIFLASH_KEY }}
          TARGET_URL: "https://mityadi-ko.github.io/Queer_Hustlers/docs/travel.html"
        run: |
          curl --fail --show-error -sSL -G "https://api.apiflash.com/v1/urltoimage" \
            --data-urlencode "access_key=${APIFLASH_KEY}" \
            --data-urlencode "url=${TARGET_URL}" \
            --data-urlencode "wait_until=network_idle" \
            --data-urlencode "delay=10" \
            --data-urlencode "width=720" \
            --data-urlencode "full_page=true" \
            --data-urlencode "fresh=true" \
            --data-urlencode "no_animation=true" \
            -o travel.png
          ls -lh travel.png

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add travel.png
          if git diff --staged --quiet; then
            echo "No changes in screenshot."
          else
            git commit -m "Auto-update travel screenshot [skip ci]"
            git push
          fi
